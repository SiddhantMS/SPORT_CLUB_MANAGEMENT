<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Player — {{ club }}</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh;}

body.cricket {--cm:#16a34a;--cl:#dcfce7;--cd:#14532d;}
body.football{--cm:#2563eb;--cl:#dbeafe;--cd:#1e3a8a;}
body.kabaddi {--cm:#ea580c;--cl:#ffedd5;--cd:#7c2d12;}

.navbar{background:#1e293b;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.brand{font-size:20px;font-weight:800;color:#fff;letter-spacing:1px;text-decoration:none;}
.nbadge{font-size:13px;font-weight:700;padding:5px 14px;border-radius:20px;background:var(--cl);color:var(--cd);}

.page{max-width:560px;margin:36px auto;padding:0 20px;}

.btn-back{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;border:2px solid #cbd5e1;background:#fff;color:#475569;font-size:14px;font-weight:600;font-family:'Nunito',sans-serif;cursor:pointer;text-decoration:none;transition:all .2s;margin-bottom:22px;}
.btn-back:hover{background:#f1f5f9;border-color:#94a3b8;}

.section-title{font-size:26px;font-weight:900;color:#1e293b;margin-bottom:4px;}
.section-sub{font-size:14px;color:#64748b;margin-bottom:24px;}

/* Player identity strip */
.player-strip{display:flex;align-items:center;gap:14px;background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex-shrink:0;background:var(--cl);color:var(--cd);}
.strip-name{font-size:16px;font-weight:800;color:#1e293b;}
.strip-sub{font-size:12px;color:#94a3b8;font-weight:600;}

/* Form */
.form-box{background:#fff;border-radius:16px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.07);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.form-group label{font-size:12px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px;}
.form-group input,.form-group select{padding:10px 13px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:'Nunito',sans-serif;color:#1e293b;background:#f8fafc;outline:none;transition:border-color .2s;}
.form-group input:focus,.form-group select:focus{border-color:var(--cm);background:#fff;}

.btn-save{display:flex;align-items:center;justify-content:center;width:100%;padding:13px;border-radius:8px;border:none;background:var(--cm);color:#fff;font-size:15px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:opacity .2s,transform .15s;margin-top:4px;}
.btn-save:hover{opacity:.9;transform:translateY(-1px);}
</style>
</head>
<body class="{{ cfg.sport }}">

<nav class="navbar">
    <a class="brand" href="/dashboard">Sports Club</a>
    <span class="nbadge">{{ cfg.emoji }} {{ cfg.name }}</span>
</nav>

<div class="page">
    <a class="btn-back" href="/players/{{ club }}">← Back to Players</a>

    <div class="section-title">Edit Player</div>
    <div class="section-sub">Update the details below and save changes</div>

    <!-- Player identity strip -->
    <div class="player-strip">
        <div class="avatar">{{ p[1][0] | upper if p[1] else '?' }}</div>
        <div>
            <div class="strip-name">{{ p[1] }}</div>
            <div class="strip-sub">ID #{{ p[0] }} · {{ cfg.name }}</div>
        </div>
    </div>

    <!-- Edit Form -->
    <div class="form-box">
        <form method="POST">

            <div class="form-row">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" value="{{ p[1] }}" required>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="age" value="{{ p[2] }}" min="10" max="60" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Type / Position</label>
                    <select name="type" required>
                        {% for t in ptypes %}
                        <option value="{{ t }}" {% if t == p[3] %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Coach</label>
                    <select name="coach" required>
                        {% for c in coaches %}
                        <option value="{{ c }}" {% if c == p[4] %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="date" name="expiry" value="{{ p[5] }}" required>
                </div>
                <div class="form-group">
                    <label>Fees (₹)</label>
                    <input type="number" name="fees" value="{{ p[6] }}" required>
                </div>
            </div>

            <button type="submit" class="btn-save">✓ Save Changes</button>
        </form>
    </div>
</div>

</body>
</html>
